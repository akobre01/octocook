# Tool substitution graph.
#
# When a recipe step requires a tool that is not in inventory.yaml,
# the scheduler walks the chain below for that tool and uses the FIRST
# substitute whose tool IS in inventory (count > 0). The step's duration
# is multiplied by `time_multiplier` and `note` is shown in the schedule.
#
# `tool: null` means "do it by hand" (no tool reservation).
#
# Substitutes are tried in order — put the closest match first.

stand_mixer:
  - tool: hand_mixer
    time_multiplier: 1.2
    note: "Use hand mixer instead of stand mixer"
  - tool: null
    time_multiplier: 1.5
    note: "Mix/knead by hand"

food_processor:
  - tool: blender
    time_multiplier: 1.0
    note: "Use blender (scrape sides as needed)"
  - tool: chef_knife
    time_multiplier: 3.0
    note: "Chop by hand"

immersion_blender:
  - tool: blender
    time_multiplier: 1.0
    note: "Use countertop blender (transfer in batches)"
  - tool: potato_masher
    time_multiplier: 1.5
    note: "Mash by hand"

microwave:
  - tool: stove_burner
    time_multiplier: 1.5
    note: "Warm on the stovetop instead of microwave"

mortar_and_pestle:
  - tool: food_processor
    time_multiplier: 0.5
    note: "Pulse in food processor"
  - tool: chef_knife
    time_multiplier: 1.5
    note: "Chop fine and crush with knife side"

dutch_oven:
  - tool: stockpot
    time_multiplier: 1.0
    note: "Use stockpot (oven steps may need a baking dish instead)"

cast_iron_skillet:
  - tool: saute_pan
    time_multiplier: 1.0
    note: "Use saute pan (less heat retention)"

rolling_pin:
  - tool: null
    time_multiplier: 1.2
    note: "Roll with a wine bottle or press by hand"

# Common tools recipes name that aren't worth listing in inventory: each has an
# obvious stand-in, so a recipe that mentions one still schedules.
muffin_tin:
  - tool: muffin_pan
    time_multiplier: 1.0
    note: "Use muffin pan"

potato_masher:
  - tool: null
    time_multiplier: 1.3
    note: "Mash with a fork"

wire_rack:
  - tool: null
    time_multiplier: 1.0
    note: "Cool on a trivet or the stovetop"

refrigerator:
  - tool: null
    time_multiplier: 1.0
    note: "Chill in the fridge"

biscuit_cutter:
  - tool: null
    time_multiplier: 1.0
    note: "Cut with the rim of a glass"

fine_mesh_sieve:
  - tool: colander
    time_multiplier: 1.0
    note: "Use colander (line with a paper towel for fine solids)"

fine_mesh_strainer:
  - tool: colander
    time_multiplier: 1.0
    note: "Use colander (line with a paper towel for fine solids)"

zester:
  - tool: grater
    time_multiplier: 1.0
    note: "Use the fine side of the grater"

small_pan:
  - tool: saucepan
    time_multiplier: 1.0
    note: "Use a saucepan"

small_bowl:
  - tool: mixing_bowl
    time_multiplier: 1.0
    note: "Use a mixing bowl"

steamer_basket:
  - tool: colander
    time_multiplier: 1.0
    note: "Steam in a colander set over a covered pot"

rice_cooker:
  - tool: saucepan
    time_multiplier: 1.0
    note: "Cook rice in a covered saucepan"

pressure_cooker:
