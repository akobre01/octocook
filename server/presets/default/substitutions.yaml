    time_multiplier: 1.3
    note: "Roast on a sheet pan in a hot oven"

electric_kettle:
  - tool: saucepan
    time_multiplier: 1.0
    note: "Boil water in a saucepan"

ladle:
  - tool: null
    time_multiplier: 1.0
    note: "Use a measuring cup to scoop"

mug:
  - tool: null
    time_multiplier: 1.0
    note: "Use any heatproof cup"

liquid_measuring_cup:
  - tool: null
    time_multiplier: 1.0
    note: "Use any measuring cup or a bowl"

canning_jar:
  - tool: null
    time_multiplier: 1.0
    note: "Use any clean lidded jar"
